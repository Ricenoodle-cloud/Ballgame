<script id="core">
const N=(x,z,y=0)=>[x,y,z];
const bridge=(id,node,states,initial=0)=>({id,type:'bridge',node,initial,states:states.map(([angle,edges])=>({angle,edges}))});
const lift=(id,node,low,high)=>({id,type:'lift',node,initial:0,states:[{height:0,edges:low},{height:2,edges:high}]});
const light=(id,plate,edge,initial=0)=>({id,type:'light',plate,initial,states:[{edges:[]},{edges:[edge]}]});
const LEVELS=[
{name:'初光',poem:'每一段旅程，都始于一束微光。',nodes:{s:N(-4,0),a:N(-2,0),b:N(0,0),c:N(2,0),g:N(4,0)},edges:[['s','a'],['a','b'],['b','c'],['c','g']],mechanisms:[]},
{name:'断桥',poem:'光，在断裂的地方，等待重逢。',nodes:{s:N(-4,0),a:N(-2,0),h:N(0,0),b:N(2,0),g:N(4,0)},edges:[['s','a'],['b','g']],mechanisms:[bridge('r','h',[[Math.PI/2,[]],[0,[['a','h'],['h','b']]]])]},
{name:'转向',poem:'有些弯路，让我们看见新的方向。',nodes:{s:N(-4,0),a:N(-2,0),h:N(0,0),d:N(0,-2),e:N(0,-4),b:N(2,0),g:N(4,0)},edges:[['s','a'],['a','h'],['d','e'],['b','g']],mechanisms:[bridge('r','h',[[Math.PI/2,[['h','d']]],[0,[['h','b']]]])]},
{name:'浮升',poem:'向上，世界还有另一层温柔。',nodes:{s:N(-4,0),a:N(-2,0),u:N(0,0),b:N(2,0,2),g:N(4,0,2)},edges:[['s','a'],['b','g']],mechanisms:[lift('u','u',[['a','u']],[['u','b']])]},
{name:'余晖',poem:'走过的地方，也能留下光。',nodes:{s:N(-4,0),a:N(-2,0),p:N(-2,-2),b:N(0,0),c:N(2,0),g:N(4,0)},edges:[['s','a'],['a','p'],['a','b'],['c','g']],mechanisms:[light('l','p',['b','c'])]},
{name:'双生',poem:'两道光，终会在同一个方向相遇。',nodes:{s:N(-6,0),a:N(-4,0),h:N(-2,0),b:N(0,0),j:N(2,0),c:N(4,0),g:N(6,0)},edges:[['s','a'],['c','g']],mechanisms:[bridge('r','h',[[Math.PI/2,[]],[0,[['a','h'],['h','b']]]]),bridge('q','j',[[Math.PI/2,[]],[0,[['b','j'],['j','c']]]])]},
{name:'回响',poem:'回望来路，远方正在苏醒。',nodes:{s:N(-4,2),a:N(-2,2),p:N(-2,0),u:N(0,2),b:N(2,2,2),h:N(2,0,2),d:N(2,-2,2),g:N(4,0,2)},edges:[['s','a'],['a','p'],['b','h']],mechanisms:[lift('u','u',[['a','u']],[['u','b']]),bridge('r','h',[[Math.PI/2,[['h','d']]],[0,[['h','g']]]]),light('l','p',['a','u'])]},
{name:'星轨',poem:'那些散落的星光，记得彼此的形状。',nodes:{s:N(-4,2),a:N(-2,2),p:N(-2,0),h:N(0,2),d:N(0,0),e:N(0,-2),b:N(2,2),q:N(2,0),g:N(4,2)},edges:[['s','a'],['a','p'],['a','h'],['d','e'],['b','q']],mechanisms:[bridge('r','h',[[Math.PI/2,[['h','d']]],[0,[['h','b']]]]),light('l','p',['b','g']),light('m','e',['b','g'])]},
{name:'织光',poem:'先留下光，再带着它，去更远的地方。',nodes:{s:N(-6,2),a:N(-4,2),h:N(-2,2),p:N(-2,0),b:N(0,2),u:N(2,2),c:N(4,2,2),j:N(4,0,2),q:N(4,-2,2),g:N(6,0,2)},edges:[['s','a'],['a','h'],['c','j']],mechanisms:[bridge('r','h',[[Math.PI/2,[['h','p']]],[0,[['h','b']]]]),lift('u','u',[['b','u']],[['u','c']]),bridge('t','j',[[Math.PI/2,[['j','q']]],[0,[['j','g']]]]),light('l','p',['b','u']),light('m','q',['j','g'])]},
{name:'归光',poem:'你走过的每一步，最终汇成了光的归途。',nodes:{s:N(-6,2),a:N(-4,2),h:N(-2,2),p:N(-2,0),b:N(0,2),u:N(2,2),c:N(4,2,2),j:N(4,0,2),q:N(4,-2,2),d:N(6,0,2),v:N(6,-2,2),g:N(6,-4,2)},edges:[['s','a'],['a','h'],['c','j'],['d','v'],['v','g']],mechanisms:[bridge('r','h',[[Math.PI/2,[['h','p']]],[0,[['h','b']]]]),lift('u','u',[['b','u']],[['u','c']]),bridge('t','j',[[Math.PI/2,[['j','q']]],[0,[['j','d']]]]),light('l','p',['b','u']),light('m','q',['v','g'])]}
].map(l=>({...l,start:'s',goal:'g'}));
// A light gate constrains its declared edge, even when a bridge/lift also supplies it.
class GameState{
 constructor(index=0){this.load(index)}
 load(index){if(!LEVELS[index])throw Error('Invalid level');this.index=index;this.level=LEVELS[index];this.player=this.level.start;this.states=this.level.mechanisms.map(m=>m.initial);this.rotating=null;this.route=[];this.moving=false;this.complete=false;this.finished=false;this.clock=0;this.visited=new Set([this.player]);this.collected=new Set();this.destination=null;this.lastError=''}
 key(p=this.player,s=this.states){return p+'|'+s.join(',')}
 edges(states=this.states){let mechanical=this.level.mechanisms.filter(m=>m.type!=='light');let edges=[...this.level.edges,...mechanical.flatMap(m=>m.states[states[this.level.mechanisms.indexOf(m)]].edges)];let same=(e,f)=>e[0]===f[0]&&e[1]===f[1]||e[0]===f[1]&&e[1]===f[0];for(let m of this.level.mechanisms.filter(m=>m.type==='light')){let e=m.states[1].edges[0];if(!mechanical.some(n=>n.states.some(s=>s.edges.some(f=>same(e,f)))))edges.push(e)}return edges.filter(e=>this.level.mechanisms.every((m,i)=>m.type!=='light'||!same(e,m.states[1].edges[0])||states[i]===1))}

 path(from,to,states=this.states){let q=[[from]],seen=new Set([from]);for(let p of q){let n=p.at(-1);if(n===to)return p;for(let[a,b]of this.edges(states)){let v=a===n?b:b===n?a:null;if(v&&!seen.has(v)){seen.add(v);q.push([...p,v])}}}return null}
 reject(reason){this.lastError=reason;return false}
 move(to){if(this.rotating||this.complete||this.moving)return this.reject('busy');if(!this.level.nodes[to])return this.reject('void');let p=this.path(this.player,to);if(!p)return this.reject('blocked');this.destination=to;this.route=p.slice(1);this.moving=!!this.route.length;return true}
 rawActions(p=this.player,s=this.states){let out=[];for(let[a,b]of this.edges(s)){let to=a===p?b:b===p?a:null;if(to){let states=[...s];this.level.mechanisms.forEach((m,i)=>{if(m.type==='light'&&m.plate===to)states[i]=1-states[i]});out.push({kind:'move',to,p:to,s:states})}}this.level.mechanisms.forEach((m,i)=>{if(m.type==='light'||m.type==='bridge'&&m.node===p)return;let states=[...s];states[i]=(states[i]+1)%m.states.length;out.push({kind:'mechanism',i,p,s:states})});return out}
 solution(player=this.player,states=this.states){let q=[{p:player,s:[...states],actions:[]}],seen=new Set();for(let v of q){let key=this.key(v.p,v.s);if(seen.has(key))continue;seen.add(key);if(v.p===this.level.goal)return v.actions;for(let a of this.rawActions(v.p,v.s))q.push({p:a.p,s:a.s,actions:[...v.actions,a.kind==='move'?{kind:a.kind,to:a.to}:{kind:a.kind,i:a.i}]})}return null}
 rotate(i){if(this.rotating||this.complete||this.moving)return this.reject('busy');let m=this.level.mechanisms[i];if(!m||m.type==='light')return this.reject('plate');if(m.type==='bridge'&&m.node===this.player)return this.reject('occupied');let next=[...this.states];next[i]=(next[i]+1)%m.states.length;if(!this.solution(this.player,next))return this.reject('stranded');this.rotating={i,elapsed:0,from:this.states[i],next:next[i]};return true}
 tick(dt){if(this.rotating){this.rotating.elapsed+=dt;if(this.rotating.elapsed>=.5-1e-9){this.states[this.rotating.i]=this.rotating.next;this.rotating=null}}if(this.complete)this.clock+=dt}
 arrive(){if(!this.moving)return [];this.player=this.route.shift();this.visited.add(this.player);let changed=[];this.level.mechanisms.forEach((m,i)=>{if(m.type==='light'&&m.plate===this.player){this.states[i]=1-this.states[i];this.collected.add(m.plate);changed.push(i)}});if(changed.length)this.route=(this.path(this.player,this.destination)||[this.player]).slice(1);if(!this.route.length){this.moving=false;if(this.player===this.level.goal){this.complete=true;this.clock=0}}return changed}
 advance(){if(!this.complete||this.clock<1.7||this.finished)return false;if(this.index+1<LEVELS.length)this.load(this.index+1);else this.finished=true;return true}
 reset(){this.load(this.index)}
}
if(typeof module!=='undefined')module.exports={LEVELS,GameState};
</script>

const audio={ctx:null,enabled:true,master:null,lastError:null,unlock(){if(!this.enabled)return Promise.resolve(false);try{if(!this.ctx||this.ctx.state==='closed')this.ctx=new (window.AudioContext||window.webkitAudioContext)();if(!this.master){this.master=this.ctx.createGain();this.master.gain.value=.9;this.master.connect(this.ctx.destination)}music.init();const ready=this.ctx.state==='running'?Promise.resolve():this.ctx.resume();return Promise.resolve(ready).then(()=>{music.set(music.enabled);music.schedule();this.lastError=this.ctx.state==='running'?null:this.ctx.state;return !this.lastError}).catch(e=>{this.lastError=String(e);console.warn('Audio resume failed',e);return false})}catch(e){this.lastError=String(e);console.warn('Audio init failed',e);return Promise.resolve(false)}},tone(f,d=.15,type='sine',volume=.06,delay=0){if(!this.enabled||!this.ctx||this.ctx.state!=='running')return;let o=this.ctx.createOscillator(),g=this.ctx.createGain(),t=this.ctx.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(volume,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d+.01)},play(k){if(k==='click'){this.tone(740,.08,'sine',.05);this.tone(1110,.1,'sine',.025,.035)}if(k==='settle'){this.tone(523,.26,'sine',.05);this.tone(784,.35,'sine',.04,.08)}if(k==='error'){this.tone(140,.18,'triangle',.07);this.tone(95,.2,'sine',.05,.08)}if(k==='step')this.tone(340+Math.random()*70,.055,'triangle',.014);if(k==='turn'){this.tone(220,.3,'sine',.04);this.tone(330,.25,'sine',.04,.15)}if(k==='plate'){[440,660,880].forEach((f,i)=>this.tone(f,.35,'sine',.045,i*.08))}if(k==='win'){[523,659,784,1046].forEach((f,i)=>this.tone(f,.6,'sine',.055,i*.13))}}};
const music={enabled:true,bus:null,next:0,beat:0,timer:null,
init(){if(this.bus||!audio.ctx)return;let c=audio.ctx;this.bus=c.createGain();this.bus.gain.value=.52;this.bus.connect(audio.master);let delay=c.createDelay(2),feedback=c.createGain(),wet=c.createGain();delay.delayTime.value=.43;feedback.gain.value=.24;wet.gain.value=.16;this.bus.connect(delay);delay.connect(feedback);feedback.connect(delay);delay.connect(wet);wet.connect(audio.master);this.next=c.currentTime+.12;this.timer=setInterval(()=>this.schedule(),100);this.schedule()},
note(midi,start,duration,volume){let c=audio.ctx;if(!c||!this.bus)return;let f=440*Math.pow(2,(midi-69)/12);for(let [ratio,gain,decay]of[[1,1,1],[2,.27,.5],[3,.09,.28]]){let o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f*ratio;o.detune.value=ratio===1?-1:1;g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(volume*gain,start+.009);g.gain.exponentialRampToValueAtTime(.0001,start+duration*decay);o.connect(g);g.connect(this.bus);o.start(start);o.stop(start+duration+.05);o.onended=()=>{o.disconnect();g.disconnect()}}},

set(enabled){this.enabled=enabled;if(this.bus)this.bus.gain.setTargetAtTime(enabled&&audio.enabled&&!document.hidden?.52:0,audio.ctx.currentTime,.18)}};

let world,actor,body,head,limbs=[],goal,devices=[],gates=[],plates=[],hits=[],hover=null,particles=[],burst=[],epoch=0,deny=0,time=0,walkTime=0,transition=false,winPlayed=false,center=new THREE.Vector3(),visualStates=[];

function marker(o,data){o.userData=data;hits.push(o);return o}
function road(parent,a,b,material,width=1.05,yOffset=-.14){let A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=A.distanceTo(B),mid=A.clone().add(B).multiplyScalar(.5);let o=box(parent,mid.x,mid.y+yOffset,mid.z,width,.25,d,material);o.rotation.y=Math.atan2(B.x-A.x,B.z-A.z);return o}
function pos(id){let p=[...game.level.nodes[id]];game.level.mechanisms.forEach((m,i)=>{if(m.type==='lift'&&m.node===id){let r=game.rotating,t=r&&r.i===i?Math.min(r.elapsed/.5,1):1;t=t*t*(3-2*t);p[1]+=r&&r.i===i?THREE.MathUtils.lerp(m.states[r.from].height,m.states[r.next].height,t):m.states[game.states[i]].height}});p[1]+=.04;return p}
const fxColors=['#ffbc83','#f48cb7','#b497ff','#79c9f1','#83e3c1','#fff2a5'];
function sparkle(position,kind='mechanism'){let count=kind==='win'?100:kind==='collect'?52:28;for(let i=0;i<count;i++){let color=fxColors[i%fxColors.length],material=new THREE.MeshBasicMaterial({color,transparent:true,opacity:1,depthWrite:false}),o=mesh(new THREE.OctahedronGeometry(kind==='win'?.075:.045,0),material,world,...position);o.castShadow=false;o.userData.ownMaterial=true;let a=Math.random()*Math.PI*2,s=.5+Math.random()*(kind==='win'?2.6:1.5);burst.push({o,velocity:new THREE.Vector3(Math.cos(a)*s,.7+Math.random()*2.3,Math.sin(a)*s),age:0,life:kind==='win'?2:1.25,spin:(Math.random()-.5)*5});}for(let i=0;i<3;i++){let material=new THREE.MeshBasicMaterial({color:fxColors[(i*2+2)%6],transparent:true,opacity:.85,depthWrite:false,side:THREE.DoubleSide}),o=ring(world,.35,.05,material);o.position.set(position[0],position[1]+.08+i*.03,position[2]);o.userData.ownMaterial=true;burst.push({o,age:-i*.1,life:kind==='win'?1.65:1,halo:true});}}

const L=game.level;showNarration(L.poem);document.getElementById('chapter').textContent=String(game.index+1).padStart(2,'0')+' / '+L.name;

for(let[id,p]of Object.entries(L.nodes)){let m=L.mechanisms.find(m=>m.node===id);if(m)continue;let group=new THREE.Group();group.position.set(...p);world.add(group);marker(box(group,0,-.27,0,1.45,.5,1.45,id===L.goal?mint:cream),{node:id});box(group,0,-.59,0,1.3,.16,1.3,blue);ring(group,.15,.015,gold);}
L.edges.forEach(([a,b])=>{let A=L.nodes[a],B=L.nodes[b];marker(road(world,A,B,cream),{node:b})});
L.mechanisms.forEach((m,i)=>{if(m.type==='light'){let edge=m.states[1].edges[0],same=e=>e.includes(edge[0])&&e.includes(edge[1]);if(!L.edges.some(same)&&!L.mechanisms.some(n=>n.type!=='light'&&n.states.some(t=>t.edges.some(same))))marker(road(world,L.nodes[edge[0]],L.nodes[edge[1]],cream),{node:edge[1]});let p=L.nodes[m.plate],group=new THREE.Group();group.position.set(...p);world.add(group);let tint=['#a9bce0','#c5a6d8','#a9d0b6','#d7ba8e','#dfb1c0'][i%5];let pm=mat(tint,tint);let plate=marker(mesh(new THREE.CylinderGeometry(.59,.59,.055,6),pm,group,0,.045,0),{node:m.plate,plate:i});plate.userData.ownMaterial=true;ring(group,.43,.082,gold);let crystal=mesh(new THREE.OctahedronGeometry(.17),gold,group,0,.26,0);plates.push({i,group,plate,crystal});let[a,b]=m.states[1].edges[0],A=L.nodes[a],B=L.nodes[b],mid=new THREE.Vector3(...A).add(new THREE.Vector3(...B)).multiplyScalar(.5);let gate=new THREE.Group();gate.position.copy(mid);gate.rotation.y=Math.atan2(B[0]-A[0],B[2]-A[2]);world.add(gate);let gm=new THREE.MeshStandardMaterial({color:tint,emissive:tint,emissiveIntensity:.4,transparent:true,opacity:.55});for(let x of[-.45,0,.45]){let bar=box(gate,x,.5,0,.065,1.1,.09,gm);bar.userData.ownMaterial=x===0}marker(box(gate,0,.55,0,1.3,1.1,.06,new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false})),{node:b});gate.children.at(-1).userData.ownMaterial=true;ring(group,.67,.04,purple);gates.push({i,gate,mid});return;}
let base=new THREE.Group();base.position.set(...L.nodes[m.node]);world.add(base);if(m.type==='bridge'){mesh(new THREE.CylinderGeometry(.79,.66,.45,32),purple,base,0,-.27,0);let rotor=new THREE.Group();base.add(rotor);let both=m.states.some(s=>s.edges.filter(e=>e.includes(m.node)).length===2);let deck=marker(box(rotor,both?0:.7,-.12,0,both?3.9:2.7,.28,1.04,blue),{mechanism:i});for(let k=0;k<(both?5:3);k++)box(rotor,(both?-1.5:.15)+k*.7,.025,0,.055,.025,.84,cream);let disk=marker(mesh(new THREE.CylinderGeometry(.66,.66,.08,40),cream,base,0,.06,0),{mechanism:i});ring(base,.49,.11,gold,.3,Math.PI*1.5);ring(base,.34,.11,gold,2,Math.PI*1.5);L.edges.filter(e=>e.includes(m.node)).forEach(e=>{let other=L.nodes[e[0]===m.node?e[1]:e[0]],local=[other[0]-base.position.x,0,other[2]-base.position.z];road(base,[0,0,0],local,blue)});devices.push({i,base,rotor,both});}else{m.states.forEach(state=>state.edges.forEach(edge=>{let other=edge[0]===m.node?edge[1]:edge[0],landing=L.nodes[other],hub=L.nodes[m.node],dx=landing[0]-hub[0],dz=landing[2]-hub[2],len=Math.hypot(dx,dz),tip=[hub[0]+dx/len*.9,landing[1],hub[2]+dz/len*.9];marker(road(world,landing,tip,blue),{node:other})}));let rail=box(base,0,.7,.64,.16,3.3,.16,purple);ring(base,.65,-.34,purple);let platform=new THREE.Group();base.add(platform);marker(box(platform,0,-.12,0,1.94,.27,1.94,blue),{mechanism:i});marker(mesh(new THREE.CylinderGeometry(.42,.42,.07,6),gold,platform,0,.05,0),{mechanism:i});for(let x of[-.48,.48])ring(platform,.1,.04,gold);devices.push({i,base,platform});}});
goal=new THREE.Group();goal.position.set(...L.nodes[L.goal]);world.add(goal);for(let x of[-.6,.6])marker(box(goal,x,.72,0,.18,1.45,.23,gold),{node:L.goal});marker(mesh(new THREE.TorusGeometry(.6,.095,8,28,Math.PI),gold,goal,0,1.43,0),{node:L.goal});let gm=new THREE.MeshBasicMaterial({color:'#fff5c9',transparent:true,opacity:.15,side:THREE.DoubleSide,depthWrite:false});let pane=marker(mesh(new THREE.PlaneGeometry(1.05,1.45),gm,goal,0,.79,0),{node:L.goal});pane.userData.ownMaterial=true;let lamp=new THREE.PointLight('#ffe6aa',3,4);lamp.position.y=1;goal.add(lamp);
actor=new THREE.Group();world.add(actor);body=new THREE.Group();actor.add(body);mesh(new THREE.ConeGeometry(.22,.42,7),cream,body,0,.48,0);head=mesh(new THREE.IcosahedronGeometry(.15,1),gold,body,0,.82,0);mesh(new THREE.ConeGeometry(.19,.23,7),cream,body,0,1,0);limbs=[];for(let [x,y,isLeg]of[[-.11,.3,true],[.11,.3,true],[-.23,.63,false],[.23,.63,false]]){let pivot=new THREE.Group();pivot.position.set(x,y,0);body.add(pivot);mesh(new THREE.CylinderGeometry(isLeg?.055:.04,isLeg?.045:.03,isLeg?.25:.24,6),isLeg?dark:cream,pivot,0,-.1,0);limbs.push(pivot)}ring(actor,.25,.025,gold);actor.position.set(...pos(game.player));
for(let k=0;k<36;k++){let o=mesh(new THREE.SphereGeometry(.018,4,4),gold,world,(Math.random()-.5)*16,Math.random()*4-1,(Math.random()-.5)*9);particles.push({o,seed:Math.random()*6})}
let points=Object.values(L.nodes),minX=Math.min(...points.map(p=>p[0])),maxX=Math.max(...points.map(p=>p[0])),minZ=Math.min(...points.map(p=>p[2])),maxZ=Math.max(...points.map(p=>p[2]));center.set((minX+maxX)/2,.5,(minZ+maxZ)/2);camera.position.copy(center).add(new THREE.Vector3(12,15,18));camera.lookAt(center);resize();updateDevices(1);
}
function resize(){let aspect=innerWidth/innerHeight,v=aspect<1?9/aspect:8.5;camera.left=-v*aspect;camera.right=v*aspect;camera.top=v;camera.bottom=-v;camera.near=.1;camera.far=100;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
function updateDevices(dt){devices.forEach(d=>{let m=game.level.mechanisms[d.i],r=game.rotating,active=r&&r.i===d.i,t=active?Math.min(r.elapsed/.5,1):1;t=t*t*(3-2*t);if(d.rotor)d.rotor.rotation.y=active?THREE.MathUtils.lerp(m.states[r.from].angle,m.states[r.next].angle,t):m.states[game.states[d.i]].angle;else d.platform.position.y=active?THREE.MathUtils.lerp(m.states[r.from].height,m.states[r.next].height,t):m.states[game.states[d.i]].height;});gates.forEach(d=>{let enabled=game.states[d.i];visualStates[d.i]=THREE.MathUtils.damp(visualStates[d.i],enabled,12,dt);d.gate.position.y=d.mid.y-visualStates[d.i]*1.6;});plates.forEach(d=>{d.plate.material.emissiveIntensity=game.states[d.i]?1.5:.15;d.crystal.visible=!game.collected.has(game.level.mechanisms[d.i].plate);d.crystal.position.y=.32+Math.sin(time*2)*.06;d.crystal.rotation.y=time*.3;});}
function pick(e){let r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera);return ray.intersectObjects(hits,false)[0]?.object}
function error(){deny=.35;audio.play('error');if(navigator.vibrate)navigator.vibrate(25)}
renderer.domElement.addEventListener('pointermove',e=>{hover=pick(e);renderer.domElement.style.cursor=hover?'pointer':'default'});
renderer.domElement.addEventListener('pointerdown',e=>{if(e.button!==0||transition)return;audio.unlock();let o=pick(e);if(!o){error();return}let mi=o.userData.mechanism,m=game.level.mechanisms[mi];if(mi!==undefined||o.userData.plate!==undefined)audio.play('click');let ok=mi!==undefined?(m.type==='lift'&&game.player!==m.node&&game.path(game.player,m.node)?game.move(m.node):game.rotate(mi)):game.move(o.userData.node);if(!ok){if(game.lastError!=='busy')error()}else if(mi!==undefined){audio.play('turn');if(game.rotating)sparkle(pos(m.node),'mechanism');}});
function select(index){if(transition)return;game.load(index);build();audio.unlock();save()}
document.getElementById('restart').onclick=()=>select(game.index);document.getElementById('dots').onclick=e=>{let b=e.target.closest('[data-level]');if(b)select(Number(b.dataset.level))};
document.getElementById('sound').onclick=()=>{audio.enabled=!audio.enabled;document.getElementById('sound').textContent=audio.enabled?'♪':'♩';document.getElementById('sound').setAttribute('aria-pressed',String(!audio.enabled));if(audio.master)audio.master.gain.setTargetAtTime(audio.enabled?.9:0,audio.ctx.currentTime,.06);if(audio.enabled)audio.unlock();music.set(music.enabled)};
document.getElementById('music').onclick=()=>{audio.unlock();music.set(!music.enabled);document.getElementById('music').setAttribute('aria-pressed',String(!music.enabled));document.getElementById('music').style.opacity=music.enabled?1:.4};
document.addEventListener('visibilitychange',()=>music.set(music.enabled));

function save(){try{localStorage.setItem('light-journey-level-v2',game.index)}catch(e){}}try{let i=Number(localStorage.getItem('light-journey-level-v2'));if(Number.isInteger(i)&&i>=0&&i<LEVELS.length)game.load(i)}catch(e){}build();
let last=performance.now(),stepClock=0;
function frame(now){requestAnimationFrame(frame);let dt=Math.min((now-last)/1000,.05);last=now;time+=dt;let turning=game.rotating;game.tick(dt);if(turning&&!game.rotating){sparkle(pos(game.level.mechanisms[turning.i].node),'mechanism');audio.play('settle');}if(game.moving){let target=new THREE.Vector3(...pos(game.route[0])),delta=target.clone().sub(actor.position),distance=delta.length(),step=dt*3;let angle=Math.atan2(delta.x,delta.z);body.rotation.y=angle;walkTime+=dt*12;stepClock+=dt;if(stepClock>.24){audio.play('step');stepClock=0}if(distance<=step){actor.position.copy(target);let wasCollected=game.collected.has(game.route[0]),changed=game.arrive();if(changed.length){audio.play('plate');sparkle(pos(game.player),wasCollected?'mechanism':'collect')}}else actor.position.addScaledVector(delta,step/distance);}else{actor.position.set(...pos(game.player));walkTime=0;stepClock=0}
limbs.forEach((p,i)=>p.rotation.x=game.moving?Math.sin(walkTime+(i%2?Math.PI:0))*(i<2?.6:.4):0);body.position.y=game.moving?Math.abs(Math.sin(walkTime))*.055:Math.sin(time*2.5)*.018;body.rotation.z=game.moving?Math.sin(walkTime)*.035:0;
updateDevices(dt);deny=Math.max(0,deny-dt);let amp=deny*.32;camera.position.copy(center).add(new THREE.Vector3(12+Math.sin(time*91)*amp,15+Math.cos(time*77)*amp,18));camera.lookAt(center);
particles.forEach(({o,seed})=>{o.position.y+=dt*(game.complete?.65:.06);if(o.position.y>4)o.position.y=-1;o.scale.setScalar(.75+Math.sin(time+seed)*.2)});updateEffects(dt);
if(game.complete){if(!winPlayed){winPlayed=true;audio.play('win');sparkle([actor.position.x,actor.position.y+.6,actor.position.z],'win');}actor.position.y=pos(game.player)[1]+Math.sin(Math.min(game.clock,1.5)/1.5*Math.PI/2)*.7;goal.children.at(-1).intensity=9+Math.sin(time*7)*2;goal.children.at(-1).color.setHSL((time*.18)%1,.65,.7);if(game.clock>=1.9&&!transition&&!game.finished){if(game.index<LEVELS.length-1){transition=true;document.getElementById('veil').style.opacity=1;let token=epoch;setTimeout(()=>{if(token===epoch){game.advance();build();save();audio.unlock()}document.getElementById('veil').style.opacity=0;transition=false},420)}else{game.advance();document.getElementById('chapter').textContent='10 / 光已归来';}}}
renderer.render(scene,camera)}requestAnimationFrame(frame);
document.addEventListener('pointerdown',()=>{if(audio.enabled)audio.unlock()},{capture:true});
if(new URLSearchParams(location.search).get('desktop')==='1')audio.unlock();
window.__LIGHT__={game,LEVELS,build,audio,music,select,project(id){let p=new THREE.Vector3(...pos(id));p.project(camera);return{x:(p.x+1)*innerWidth/2,y:(1-p.y)*innerHeight/2}}};
}
